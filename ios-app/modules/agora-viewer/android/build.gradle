plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.agoraviewer'
version = '0.1.0'

android {
  namespace "expo.modules.agoraviewer"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'io.agora.rtc:full-sdk:4.6.2'
}
