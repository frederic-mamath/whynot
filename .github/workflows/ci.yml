name: ios-app CI

on:
  pull_request:
    branches: [main]
    paths:
      - "ios-app/**"
      - "scripts/arch-test.mjs"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - "scripts/arch-test.mjs"
      - ".github/workflows/ci.yml"

defaults:
  run:
    working-directory: ios-app

jobs:
  ios-app-checks:
    name: ios-app-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            ios-app/package-lock.json

      # ios-app's tsconfig maps `@server/*` to `../app/src/*` so the AppRouter
      # type can be imported by the tRPC client. tsc follows that import into
      # the backend source files, which need kysely / pg / @trpc/server / zod
      # installed locally. Install backend deps before installing ios-app.
      - name: Install backend dependencies
        working-directory: app
        run: npm ci

      - name: Install ios-app dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Architecture tests
        run: npm run arch:test
